<body>
<section id="title" class="screen active"><div class="card">
<div class="logo">MEN <span>IN</span> BLOOD</div><div class="tag">血流の守護者たち / v22 Rebuild Fix</div>
<div class="diffs"><div class="diff sel" data-d="easy"><b>Easy</b><small>潜伏30%・体力多め</small></div><div class="diff" data-d="normal"><b>Normal</b><small>潜伏1体・標準</small></div><div class="diff" data-d="hard"><b>Hard</b><small>潜伏2体・感染強め</small></div></div>
<button id="start">START</button></div></section>
<section id="game" class="screen">
<div class="top"><div class="titleText">MEN <span>IN</span> BLOOD v35</div><button class="secondary" onclick="location.reload()">TITLE</button></div>
<main class="panel"><div class="stats"><div class="stat"><label>BODY HP</label><b id="hp">10</b><div class="bar"><div class="fill" id="hpfill"></div></div></div><div class="stat"><label>OXYGEN</label><b><span id="score">0</span>/3</b></div><div class="stat"><label>TURN</label><b id="turn">1</b></div><div class="stat"><label>PHASE</label><b id="phase">EVENT</b></div></div><div class="boardWrap"><div class="board" id="board"></div></div></main>
<aside class="side">
<div class="event" id="event"><h2>MISSION</h2><p>酸素を届け、潜伏感染を探索し、傷口と炎症を処理せよ。</p></div>
<div class="panel"><div class="controls"><button class="full" id="eventBtn">EVENT</button><button id="diceBtn">DICE</button><button class="secondary" id="endBtn">END TURN</button></div></div>
<div class="agent" id="rbcCard"><h3>赤血球 <span class="pill" id="rbcO">酸素なし</span></h3><small>血流移動。肺で酸素、脳へ輸送。</small><div class="moves" id="rbcMoves"></div></div>
<div class="agent" id="wbcCard"><h3>白血球 <span class="pill">遊走</span></h3><small>自由移動。戦闘と探索。</small><div class="moves" id="wbcMoves"></div></div>
<div class="agent" id="pltCard"><h3>血小板</h3><small>止血と炎症処理。</small><div class="moves" id="pltMoves"></div></div>

</aside>
</section>
<div class="overlay" id="over"><div class="result"><h2 id="resT">BODY STABILIZED</h2><p id="resP"></p><button onclick="location.reload()">TITLE</button></div></div>
<script>
const pos={
"肺":{x:95,y:215},"肺-心臓1":{x:175,y:215},"肺-心臓2":{x:245,y:215},"心臓":{x:330,y:215},
"心臓-筋肉1":{x:415,y:215},"心臓-筋肉2":{x:485,y:215},"筋肉":{x:565,y:215},
"心臓-脳1":{x:330,y:125},"脳":{x:330,y:45},
"心臓-肝臓1":{x:330,y:295},"心臓-肝臓2":{x:330,y:365},"肝臓":{x:330,y:435},
"肝臓-胃1":{x:215,y:435},"胃":{x:95,y:435},
"肝臓-皮膚1":{x:445,y:435},"皮膚":{x:565,y:435}
};
// v29 centered board positions
Object.keys(pos).forEach(k=>{pos[k].x=114+(pos[k].x-95)*0.78});
const organs=["肺","心臓","脳","筋肉","胃","肝臓","皮膚"], labels={"肺":"肺","心臓":"心臓","脳":"脳","筋肉":"筋肉","胃":"胃","肝臓":"肝臓","皮膚":"皮膚"};
const graph={
"肺":["肺-心臓1"],"肺-心臓1":["肺","肺-心臓2"],"肺-心臓2":["肺-心臓1","心臓"],
"心臓":["肺-心臓2","心臓-脳1","心臓-筋肉1","心臓-肝臓1"],
"心臓-脳1":["心臓","脳"],"脳":["心臓-脳1"],
"心臓-筋肉1":["心臓","心臓-筋肉2"],"心臓-筋肉2":["心臓-筋肉1","筋肉"],"筋肉":["心臓-筋肉2"],
"心臓-肝臓1":["心臓","心臓-肝臓2"],"心臓-肝臓2":["心臓-肝臓1","肝臓"],"肝臓":["心臓-肝臓2","肝臓-胃1","肝臓-皮膚1"],
"肝臓-胃1":["肝臓","胃"],"胃":["肝臓-胃1"],
"肝臓-皮膚1":["肝臓","皮膚"],"皮膚":["肝臓-皮膚1"]
};
const routes={
"肺":["心臓","肺-心臓2","肺-心臓1","肺"],
"脳":["心臓","心臓-脳1","脳"],
"筋肉":["心臓","心臓-筋肉1","心臓-筋肉2","筋肉"],
"肝臓":["心臓","心臓-肝臓1","心臓-肝臓2","肝臓"],
"胃":["心臓","心臓-肝臓1","心臓-肝臓2","肝臓","肝臓-胃1","胃"],
"皮膚":["心臓","心臓-肝臓1","心臓-肝臓2","肝臓","肝臓-皮膚1","皮膚"]
};
let difficulty="easy",S,ctx;
function sfx(n){try{ctx=ctx||new(AudioContext||webkitAudioContext)();let o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=n==="bad"?130:n==="hit"?780:n==="move"?540:320;g.gain.value=.025;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.1);o.stop(ctx.currentTime+.12)}catch(e){}}
function init(){let hp=difficulty==="easy"?15:difficulty==="hard"?7:10;S={hp,max:hp,score:0,turn:1,phase:"event",sel:"rbc",moves:0,rbc:{place:"心臓",oxygen:false,acted:false,target:null,route:null,idx:0},wbc:{place:"心臓",acted:false},plt:{place:"心臓",acted:false,target:null,route:null,idx:0},path:[],latent:[],dorm:[],wounds:[],infl:[],oxy:null,fever:0,slow:false,over:false};drawBoard();startLatent();log("作戦開始。");update()}
function startLatent(){let n=difficulty==="easy"?(Math.random()<.3?1:0):difficulty==="normal"?1:2;let a=[["コロナ","肺",2,3,3,0],["結核","肺",4,4,3,-2],["ヘルペス","皮膚",3,5,4,0]];for(let i=0;i<n;i++){let x=a[Math.floor(Math.random()*a.length)];S.latent.push({id:Math.random(),name:x[0],place:x[1],t:x[2],detect:x[3],target:x[4],hp:x[5]})}if(n)log(`開始時潜伏：${n}体`)}
function drawBoard(){let b=board;b.innerHTML="";Object.keys(pos).forEach(k=>{let e=document.createElement("div");e.className="space "+(organs.includes(k)?"organ "+(k==="心臓"?"heart":""):"");e.style.left=pos[k].x+"px";e.style.top=pos[k].y+"px";e.textContent=organs.includes(k)?labels[k]:"";b.appendChild(e)});["rbc","wbc","plt"].forEach(c=>{let e=document.createElement("div");e.id=c;e.className="token "+c;e.textContent=c==="rbc"?"赤":c==="wbc"?"白":"板";b.appendChild(e)})}
function ev(){if(S.phase!=="event")return;sfx();let bag=difficulty==="hard"?["rhino","flu","corona","staph","wound","strep","herpes","exercise","rare"]:["rhino","flu","corona","staph","wound","strep","exercise","rare"];let e=bag[Math.floor(Math.random()*bag.length)];apply(e);S.rbc.acted=S.wbc.acted=S.plt.acted=false;S.sel="rbc";S.phase="roll";update()}
function spawn(n,pl,c,target,hp=0){for(let i=0;i<c;i++)S.path.push({id:Math.random(),name:n,place:pl,target,hp,dc:delay(n)})}
function delay(n){return n==="結核"||n==="破傷風"?5:n==="コロナ"||n==="インフル"?4:3}
function apply(e){if(e==="rhino"){spawn("ライノ","肺",2,2);show("ライノウイルス","弱いが増えやすい。")}if(e==="flu"){spawn("インフル","肺",2,3);show("インフルエンザ","肺に複数発生。")}if(e==="corona"){S.latent.push({id:Math.random(),name:"コロナ",place:"肺",t:2,detect:3,target:3,hp:0});show("潜伏：コロナ","2ターン後に発症。")}if(e==="herpes"){S.latent.push({id:Math.random(),name:"ヘルペス",place:"皮膚",t:3,detect:5,target:4,hp:0});show("潜伏：ヘルペス","休眠・再発する。")}if(e==="staph"){S.wounds.push({place:"皮膚",age:0});spawn("ブドウ","皮膚",1,3,-1);show("ブドウ球菌","傷口と発生。")}if(e==="wound"){S.wounds.push({place:"皮膚",age:0});show("傷口","皮膚に❌。")}if(e==="strep"){spawn("溶連菌","胃",2,2);show("溶連菌","赤血球の酸素を奪う。")}if(e==="exercise"){S.oxy={place:"筋肉",t:3};show("激しい運動","筋肉にO₂要求。")}if(e==="rare"){rare()}}
function rare(){let r=Math.random();if(r<.33){S.path=S.path.filter(p=>p.name!=="インフル");S.latent=S.latent.filter(p=>p.name!=="コロナ");show("💉ワクチン","インフルとコロナ対策。")}else if(r<.66){let b=["結核","ブドウ","溶連菌","破傷風"];S.path=S.path.filter(p=>!b.includes(p.name));S.latent=S.latent.filter(p=>!b.includes(p.name));show("💊抗生物質","細菌だけ除去。")}else{S.hp=Math.min(S.max,S.hp+1);show("睡眠","体力+1。")}}
function roll(){if(S.phase!=="roll")return;S.moves=Math.max(1,(Math.random()*6|0)+1-(S.slow?1:0));S.phase="move";log(`${name(S.sel)} サイコロ${S.moves}`);update()}
function next(){S[S.sel].acted=true;S.moves=0;if(!S.rbc.acted){S.sel="rbc";S.phase="roll"}else if(!S.wbc.acted){S.sel="wbc";S.phase="roll"}else if(!S.plt.acted){S.sel="plt";S.phase="roll"}else S.phase="end";update()}

function branchMove(c,d){
  let a=S[c];
  if(a.target){log(`${a.target}へ移動中`);return;}
  if(a.place!=="肝臓"){log("分岐移動は肝臓から行う。");return;}
  const branchRoutes={
    "胃":["肝臓","肝臓-胃1","胃"],
    "皮膚":["肝臓","肝臓-皮膚1","皮膚"]
  };
  const route=branchRoutes[d];
  if(!route){return;}
  a.target=d;
  a.route=route;
  a.idx=0;
  // 1マス進める
  a.idx++;
  a.place=a.route[a.idx];
  S.moves--;
  sfx("move");
  arrive(c);
  if(a.idx===a.route.length-1){
    a.target=null;
    a.route=null;
    a.idx=0;
  }
  if(S.moves<=0)next();else update();
}
function flow(c,d){let a=S[c];if(!a.target){if(a.place!=="心臓"){log("先に心臓へ戻る。");return}a.target=d;a.route=routes[d];a.idx=0}if(a.target!==d){log(`${a.target}へ移動中`);return}if(a.idx<a.route.length-1){a.idx++;a.place=a.route[a.idx];S.moves--;sfx("move");arrive(c)}if(a.idx===a.route.length-1){if(c==="rbc"&&a.place==="肺"){a.oxygen=true;log("酸素獲得。")}a.target=null;a.route=null;a.idx=0}if(S.moves<=0)next();else update()}
function heart(c){let a=S[c];if(a.target){log("目的地まで戻れない。");return}if(a.place==="心臓")return;let r=Object.values(routes).find(r=>r.includes(a.place));let i=r.indexOf(a.place);a.place=r[i-1];S.moves--;sfx("move");arrive(c);if(S.moves<=0)next();else update()}
function wmove(d){S.wbc.place=d;S.moves--;sfx("move");signalLog();contact();if(S.moves<=0)next();else update()}
function arrive(c){if(c==="rbc"){let r=S.rbc;if(r.oxygen&&r.place==="脳"){S.score++;r.oxygen=false;log("脳へ酸素輸送。")}if(r.oxygen&&S.oxy&&r.place===S.oxy.place){S.oxy=null;r.oxygen=false;S.hp=Math.min(S.max,S.hp+1);log("筋肉へ酸素。")}}contact();check()}
function contact(){if(S.rbc.oxygen&&S.path.some(p=>p.name==="溶連菌"&&p.place===S.rbc.place)){S.rbc.oxygen=false;log("溶連菌が酸素を奪った。")}}
function fight(){let cs=S.path.map((p,i)=>({...p,i})).filter(p=>p.place===S.wbc.place);if(!cs.length)return log("敵なし");let p=cs.sort((a,b)=>b.target-a.target)[0],r=(Math.random()*6|0)+1+(S.fever?1:0);if(r>=p.target){S.path.splice(p.i,1);sfx("hit");if(p.name==="ヘルペス"&&Math.random()<.5){S.dorm.push({name:"ヘルペス",place:"皮膚",t:4});log("ヘルペス休眠。")}else log(`${p.name}除去。`)}else{sfx("bad");log(`${p.name}失敗。`)}next()}
function explore(){let cs=S.latent.map((p,i)=>({...p,i})).filter(p=>p.place===S.wbc.place);if(!cs.length){log("探索反応なし。");sfx("bad");next();return}let p=cs[0],r=(Math.random()*6|0)+1;if(r>=p.detect){S.latent.splice(p.i,1);sfx("hit");log(`${p.name}を完全滅菌。`)}else{sfx("bad");log("探索失敗。")}next()}
function clot(){let i=S.wounds.findIndex(w=>w.place===S.plt.place);if(i<0)return;S.wounds.splice(i,1);sfx("hit");log("止血。");next()}
function suppress(){let i=S.infl.findIndex(f=>f.place===S.plt.place);if(i<0)return;S.infl.splice(i,1);sfx("hit");log("炎症を抑えた。");next()}
function endTurn(){if(S.phase!=="end")return;if(S.oxy){S.oxy.t--;if(S.oxy.t<=0){S.hp--;S.oxy.t=2;log("酸素要求放置。体力-1。")}}S.path.forEach(p=>{if(p.hp){p.dc--;if(p.dc<=0){S.hp+=p.hp;p.dc=delay(p.name);log(`${p.name}ダメージ${p.hp}`)}}});S.latent.forEach(p=>p.t--);let act=S.latent.filter(p=>p.t<=0);S.latent=S.latent.filter(p=>p.t>0);act.forEach(p=>{spawn(p.name,p.place,p.name==="結核"||p.name==="ヘルペス"?1:2,p.target,p.hp);log(`${p.name}発症。`)});S.dorm.forEach(p=>p.t--);let re=S.dorm.filter(p=>p.t<=0);S.dorm=S.dorm.filter(p=>p.t>0);re.forEach(p=>S.latent.push({name:"ヘルペス",place:"皮膚",t:2,detect:5,target:4,hp:0}));S.infl.forEach(f=>{f.age++;if(f.age>=3){S.hp--;f.age=0;log("炎症放置。体力-1。")}});let counts={};S.path.forEach(p=>counts[p.place]=(counts[p.place]||0)+1);Object.entries(counts).forEach(([pl,c])=>{if(c>=3&&!S.infl.some(f=>f.place===pl)&&Math.random()<.35)S.infl.push({place:pl,age:0})});movePath();S.fever=S.path.length>=3;S.turn++;S.phase="event";show("TURN "+S.turn,"次のイベントへ。");check();update()}
function movePath(){S.path.forEach(p=>{if(["破傷風","結核","ヘルペス"].includes(p.name))return;let o=graph[p.place]||[];if(!o.length)return;if(p.name==="溶連菌")o.sort((a,b)=>dist(a,S.rbc.place)-dist(b,S.rbc.place));p.place=o[0]||o[Math.random()*o.length|0]});contact()}
function dist(a,b){let q=[[a,0]],s=new Set([a]);while(q.length){let [n,d]=q.shift();if(n===b)return d;(graph[n]||[]).forEach(x=>{if(!s.has(x)){s.add(x);q.push([x,d+1])}})}return 99}
function signal(){if(!S.latent.length)return null;let best=null;S.latent.forEach(p=>{let d=dist(S.wbc.place,p.place);if(!best||d<best.d)best={...p,d}});return best}
function signalLog(){let s=signal();if(!s)return;if(s.d===2)log("微弱シグナル。");if(s.d===1)log("強いシグナル。");if(s.d===0)log("潜伏発見。探索可能。")}
function renderMoves(){["rbc","wbc","plt"].forEach(c=>{document.getElementById(c+"Card").classList.toggle("active",S.sel===c);document.getElementById(c+"Moves").innerHTML=""});if(S.phase!=="move")return;let el=document.getElementById(S.sel+"Moves");if(S.sel==="wbc"){graph[S.wbc.place].forEach(d=>el.appendChild(btn(dir(S.wbc.place,d),()=>wmove(d))));if(S.path.some(p=>p.place===S.wbc.place))el.appendChild(btn("戦う",fight));if(S.latent.some(p=>p.place===S.wbc.place))el.appendChild(btn("探索",explore,"secondary"))}else{let a=S[S.sel];if(!a.target&&a.place==="肝臓"){
  el.appendChild(btn("心臓",()=>heart(S.sel)));
  el.appendChild(btn("胃",()=>branchMove(S.sel,"胃")));
  el.appendChild(btn("皮膚",()=>branchMove(S.sel,"皮膚")));
}else{
  if(!a.target&&a.place!=="心臓")el.appendChild(btn("心臓",()=>heart(S.sel)));
  if(a.place==="心臓"&&!a.target)Object.keys(routes).forEach(o=>el.appendChild(btn(o,()=>flow(S.sel,o))));
  else if(a.target)el.appendChild(btn(a.target,()=>flow(S.sel,a.target)));
}if(S.sel==="plt"&&S.wounds.some(w=>w.place===a.place))el.appendChild(btn("止血",clot));if(S.sel==="plt"&&S.infl.some(f=>f.place===a.place))el.appendChild(btn("炎症",suppress))}el.appendChild(btn("待機",next,"secondary"))}
function renderBoard(){document.querySelectorAll(".bug,.mark,.timer").forEach(e=>e.remove());place("rbc",S.rbc.place,-12,-12);place("wbc",S.wbc.place,12,12);place("plt",S.plt.place,12,-12);let b=board,cnt={};let off=pl=>{cnt[pl]=(cnt[pl]||0)+1;let n=cnt[pl];return[(n%3-1)*13,Math.floor((n-1)/3)*13]};S.path.forEach(p=>{let [x,y]=off(p.place),e=document.createElement("div");e.className="bug "+cls(p.name);e.textContent=lab(p.name);e.style.left=pos[p.place].x+x+"px";e.style.top=pos[p.place].y+y+"px";b.appendChild(e);if(p.hp){let t=document.createElement("div");t.className="timer";t.textContent=p.dc+"T";t.style.left=pos[p.place].x+x+13+"px";t.style.top=pos[p.place].y+y-14+"px";b.appendChild(t)}});S.wounds.forEach(w=>mark("wound","❌",w.place,-18,-18));S.infl.forEach(f=>mark("mark inflam","炎",f.place,18,-18));if(S.oxy)mark("mark oxy","O₂",S.oxy.place,-18,18)}
function update(){hp.textContent=S.hp;hpfill.style.width=(100*S.hp/S.max)+"%";score.textContent=S.score;turn.textContent=S.turn;phase.textContent=S.phase.toUpperCase()+(S.phase==="move"?" "+S.moves:"");rbcO.textContent=S.rbc.oxygen?"酸素あり":"酸素なし";eventBtn.disabled=S.phase!=="event";diceBtn.disabled=S.phase!=="roll";endBtn.disabled=S.phase!=="end";let sig=signal(),sh="";if(sig){if(sig.d===0)sh='<div class="signal found">⚠⚠⚠ 発見：探索可能</div>';else if(sig.d===1)sh='<div class="signal strong">⚠⚠ 強いシグナル</div>';else if(sig.d===2)sh='<div class="signal weak">⚠ 微弱なシグナル</div>'}status.innerHTML=[`難易度:${difficulty}`,`病原体:${S.path.length}`,`潜伏:${S.latent.length}`,`傷:${S.wounds.length}`,`炎症:${S.infl.length}`,S.fever?"発熱":null,S.oxy?`O₂:${S.oxy.t}T`:null].filter(Boolean).map(x=>`<span class=pill>${x}</span>`).join("")+S.latent.map(p=>`<span class=latent>${p.name}:${p.t}T</span>`).join("")+S.dorm.map(p=>`<span class=dorm>休眠:${p.t}T</span>`).join("")+sh;renderMoves();renderBoard();check()}
function check(){if(S.score>=3)finish(true);if(S.hp<=0)finish(false)}
function finish(w){if(S.over)return;S.over=true;over.classList.add("show");resT.textContent=w?"BODY STABILIZED":"SYSTEM FAILURE";resP.textContent=w?"脳へ酸素が届いた。":"体が限界を迎えた。"}
function btn(t,f,c=""){let b=document.createElement("button");b.textContent=t;b.onclick=f;if(c)b.className=c;return b}function dir(a,b){let A=pos[a],B=pos[b],dx=B.x-A.x,dy=B.y-A.y;return Math.abs(dx)>Math.abs(dy)?dx>0?"右":"左":dy>0?"下":"上"}function place(id,pl,x,y){let e=document.getElementById(id);e.style.left=pos[pl].x+x+"px";e.style.top=pos[pl].y+y+"px"}function mark(c,t,pl,x,y){let e=document.createElement("div");e.className=c+" mark";e.textContent=t;e.style.left=pos[pl].x+x+"px";e.style.top=pos[pl].y+y+"px";board.appendChild(e)}function cls(n){return n==="ライノ"?"rhino":n==="インフル"?"flu":n==="コロナ"?"corona":n==="結核"?"tb":n==="ブドウ"?"staph":n==="溶連菌"?"strep":n==="ヘルペス"?"herpes":"tet"}function lab(n){return n==="ライノ"?"ラ":n==="インフル"?"イ":n==="コロナ"?"コ":n==="結核"?"結":n==="ブドウ"?"ブ":n==="溶連菌"?"溶":n==="ヘルペス"?"ヘ":"破"}function name(c){return c==="rbc"?"赤血球":c==="wbc"?"白血球":"血小板"}function show(t,p){document.getElementById("event").innerHTML=`<h2>${t}</h2><p>${p}</p>`}function log(t){let d=document.createElement("div");d.textContent=t;document.getElementById("log").prepend(d)}
document.querySelectorAll(".diff").forEach(d=>d.onclick=()=>{document.querySelectorAll(".diff").forEach(x=>x.classList.remove("sel"));d.classList.add("sel");difficulty=d.dataset.d});start.onclick=()=>{title.classList.remove("active");game.classList.add("active");init()};eventBtn.onclick=ev;diceBtn.onclick=roll;endBtn.onclick=endTurn;
</script>
</body></html>
